"$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

[mgr]

prepend_keymap = [
	# Hopping
	{ on = "j", run = "arrow 1" },
	{ on = "k", run = "arrow -1" },
	{ on = "<Down>", run = "arrow 1" },
	{ on = "<Up>", run = "arrow -1" },
	{ on = "u", run = "arrow prev" },
	{ on = "e", run = "arrow next" },

	{ on = "U", run = "arrow -5" },
	{ on = "E", run = "arrow 5" },

	# Navigation
	# { on = "n", run = "leave" },

	# { on = "N", run = "back" },
	# { on = "I", run = "forward" },

	# Seeking
	{ on = "K", run = "seek -5" },
	{ on = "J", run = "seek 5" },

	# Operation
	# { on = "l", run = "link" },
	# { on = "L", run = "link --relative" },

	# Find
	# { on = "-", run = "find_arrow" },
	# { on = "=", run = "find_arrow --previous" },

	# Goto
	{ on = [ "g", "r" ], run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"' },
	{ on = [ 'g', 't' ], run = 'shell -- ya emit cd "$(zoxide query tmp)"', desc = "Go tmp" },
	# { on = [ "g", "c" ], run = "plugin vcs-files" },

	# Shell
	{ on = "$", run = 'shell --block $SHELL' },

	# Drop to Shell
	{ on = [ "<C-t>" ], run = 'shell $SHELL --block', desc = "Open shell here" },

	# Open gui file manager
	{ on = [ "<C-Space>", "f" ], run = '''shell nemo --block''', desc = "Open gui file manager" },

	# Plugins
	{ on = [ "<C-Space>", "g", "d" ],      run = "plugin diff", desc = "Git diff" },
	{ on = [ "c", "m" ], run = "plugin chmod" },
	{ on = [ "b", "a" ], run = "plugin mactag add" },
	{ on = [ "b", "r" ], run = "plugin mactag remove" },
	# { on = "i", run = "plugin smart-enter" },
	{ on = [ "<C-Space>", "g", "g" ], run = "plugin lazygit" },
	{ on   = [ "c", "a" ], run  = "plugin compress" },
	{ on   = "l", run  = "plugin smart-enter", desc = "Enter the child directory, or open the file" },

	{ on = "M", run = "plugin mount", desc = "Mount" },
	# { on = [ "M", "M" ], run = "plugin mount", desc = "Mount" },
	#
 #    # { on = [ "M", "m" ], run = "plugin gvfs -- select-then-mount", desc = "Mount" },
 #    { on = [ "M", "m" ], run = "plugin gvfs -- select-then-mount --jump", desc = "Mount(gvfs) && Jump" },
	#
 #    { on = [ "M", "R" ], run = "plugin gvfs -- remount-current-cwd-device", desc = "Remount cwd" },
 #    { on = [ "M", "u" ], run = "plugin gvfs -- select-then-unmount --eject", desc = "Eject" },
 #    { on = [ "M", "U" ], run = "plugin gvfs -- select-then-unmount --eject --force", desc = "Force eject/unmount" },
	#
 #    { on = [ "M", "a" ], run = "plugin gvfs -- add-mount", desc = "Add a GVFS mount URI" },
 #    { on = [ "M", "e" ], run = "plugin gvfs -- edit-mount", desc = "Edit a GVFS mount URI" },
 #    { on = [ "M", "r" ], run = "plugin gvfs -- remove-mount", desc = "Remove a GVFS mount URI" },
	#
 #    # Jump
 #    { on = [ "g", "m" ], run = "plugin gvfs -- jump-to-device --automount", desc = "Automount && Jump" },
 #    { on = [ "`", "`" ], run = "plugin gvfs -- jump-back-prev-cwd", desc = "Jump back" },
]

