# Arch Linux on the shared ESP, written to /boot/loader/entries/arch.conf by the
# NixOS activation script.
#
# Visor stops scanning raw kernels as soon as it finds BLS entries, so Arch has
# to be described here instead of relying on auto-detection of /vmlinuz-linux-zen.
#
# Visor loads exactly one initrd (a multi-initrd line is concatenated into a
# single path and fails to open), so amd-ucode.img is intentionally omitted.
# It only carries early CPU microcode; the kernel boots without it.
title Arch Linux
version Rolling
linux /vmlinuz-linux-zen
initrd /initramfs-linux-zen.img
options root=UUID=d3074436-1943-4368-98f2-610b49dfab37 rw vt.default_red=30,243,166,249,137,245,148,186,88,243,166,249,137,245,148,166 vt.default_grn=30,139,227,226,180,194,226,194,91,139,227,226,180,194,226,173 vt.default_blu=46,168,161,175,250,231,213,222,112,168,161,175,250,231,213,200 mitigations=off nowatchdog resume=UUID=7faaccfe-1ef9-40d3-9238-c63565854bd3
sort-key arch
