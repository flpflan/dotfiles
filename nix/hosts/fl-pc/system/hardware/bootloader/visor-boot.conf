# Visor boot manager — fl-pc
#
# Installed to /boot/EFI/visor/boot.conf by the NixOS activation script.
#
# Do NOT add `entry { }` blocks here. Visor only auto-detects entries when
# boot.conf supplies none, and the whole point of this setup is:
#   * NixOS      -> BLS entries generated by the systemd-boot module
#   * Arch Linux -> BLS entry /loader/entries/arch.conf (activation script)
#   * Windows    -> EFI/Microsoft/Boot/bootmgfw.efi
# Adding an entry block would switch all of that off. Arch cannot rely on raw
# kernel auto-detection either: Visor stops scanning raw kernels once any BLS
# entry exists, so it is described in loader/entries/arch.conf instead.

timeout=5

# NixOS BLS entry files are content-hashed (nixos-<sha256>.conf) and all share
# sort-key "nixos", so Visor cannot reliably tell which generation is newest.
# Remembering the last choice keeps the default sane between rebuilds.
remember_last=1

# Everything bootable lives on the ESP, so the quick scan is enough and much
# faster than sweeping every volume.
scan=quick

# Keep Visor's own UEFI boot entry and the BOOTx64.EFI fallback repaired even
# when Windows updates or a firmware reset reshuffles the boot order.
selfheal=1
restore_fallback=1
