# Mouse
MBTN_LEFT     cycle pause
MBTN_LEFT_DBL cycle fullscreen
MBTN_RIGHT    ignore
MBTN_BACK     playlist-prev
MBTN_FORWARD  playlist-next

# Special keys
q quit 4
ESC set fullscreen no
ESC {encode} quit 4
SPACE cycle pause
ENTER cycle fullscreen
f cycle fullscreen
CLOSE_WIN quit
CLOSE_WIN {encode} quit 4

# Arrow keys
UP add volume  2
DOWN add volume -2
LEFT no-osd seek -3 exact
RIGHT no-osd seek  3 exact

# Seeking
Ctrl+LEFT no-osd sub-seek -1
Ctrl+RIGHT no-osd sub-seek  1
Shift+LEFT seek -10
Shift+RIGHT seek  10
, frame-back-step
. frame-step

# Speed
- multiply speed 1/1.1
= multiply speed 1.1
_ multiply speed 0.5
+ multiply speed 2.0
BS set speed 1.0
Shift+BS set speed 0.26

# Subtitle
Ctrl+UP cycle sub
Ctrl+DOWN cycle sub down
Shift+UP add sub-pos -5
Shift+DOWN add sub-pos +5
Ctrl+- add sub-scale +0.1
Ctrl+= add sub-scale -0.1

# Playlist
[ playlist-prev
] playlist-next

# Delay
Ctrl+u add sub-delay -0.1
Ctrl+e add sub-delay +0.1
Ctrl+n add audio-delay 0.100
Ctrl+i add audio-delay -0.100

# Panning / Zooming
Ctrl+Shift+DOWN add video-pan-y  -0.1
Ctrl+Shift+UP add video-pan-y +0.1
Ctrl+Shift+RIGHT add video-pan-x  -0.1
Ctrl+Shift+LEFT add video-pan-x +0.1
Ctrl+- add video-zoom -0.1
Ctrl+= add video-zoom  0.1
Ctrl+BS set video-zoom 0; set video-pan-x 0; set video-pan-y 0

# Misc
` script-binding console/enable
m cycle mute
v script-binding stats/display-stats-toggle
t cycle ontop
a cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"

s cycle sub-visibility
S cycle secondary-sub-visibility
r no-osd cycle_values video-rotate "90" "180" "270" "0"
R no-osd cycle_values video-rotate "0" "270" "180" "90"
c screenshot video
C screenshot
l ab-loop
L cycle-values loop-file "inf" "no"

Alt+1 set current-window-scale 0.5
Alt+2 set current-window-scale 1.0

1     add contrast 1
!     add contrast -1
2     add brightness 1
@     add brightness -1
3     add gamma 1
SHARP add gamma -1
4     add saturation 1
$     add saturation -1

# Filter
Ctrl+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode A (Fast)"
Ctrl+! no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_Restore_CNN_S.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode A+A (Fast)"
Ctrl+2 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode B (Fast)"
Ctrl+@ no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_S.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode B+B (Fast)"
Ctrl+3 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode C (Fast)"
Ctrl+# no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Restore_CNN_S.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode C+A (Fast)"
Ctrl+4 no-osd change-list glsl-shaders set "~~/shaders/ACNet.glsl"; show-text "ACNet: Mode 1"
Ctrl+$ no-osd change-list glsl-shaders set "~~/shaders/ACNet_HDN_L1.glsl"; show-text "ACNet: Mode 2"
Ctrl+5 no-osd change-list glsl-shaders set "~~/shaders/ACNet_HDN_L2.glsl"; show-text "ACNet: Mode 3"
Ctrl+% no-osd change-list glsl-shaders set "~~/shaders/ACNet_HDN_L3.glsl"; show-text "ACNet: Mode 4"
Ctrl+6 no-osd change-list glsl-shaders set "~~/shaders/FSR.glsl"; show-text "FSR"
Ctrl+9 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_3DGraphics_Upscale_x2_US.glsl:~~/shaders/Anime4K_3DGraphics_AA_Upscale_x2_US.glsl"; show-text "Anime4K: Mode 3D"
Ctrl+0 no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared"

# SCRIPT KEYBINDINGS
~ script-message cycle-commands "apply-profile HDR ; show-text 'HDR profile applied'" "apply-profile HDR restore ; show-text 'HDR profile restored'"
# ~ script-message cycle-commands "apply-profile Clip ; show-text 'Clip profile applied'" "apply-profile Mobius ; show-text 'Mobius profile applied'" "apply-profile Reinhard ; show-text 'Reinhard profile applied'" "apply-profile Hable ; show-text 'Hable profile applied'" "apply-profile bt.2390 ; show-text 'bt.2390 profile applied'" "apply-profile Gamma ; show-text 'Gamma profile applied'" "apply-profile Linear ; show-text 'Linear profile applied'"
c           script-binding cycle-visualizer         # cycle audio visualizer (audio-visualizer.lua)
b           script-binding set_gif_start            # set the start timestamp for to make GIF (mpv-gif.lua)
B           script-binding set_gif_end              # set the stop timestamp for to make GIF (mpv-gif.lua)
ctrl+b      script-binding make_gif                 # make the GIF using start and stop timestamps (mpv-gif.lua)
ctrl+B      script-binding make_gif_with_subtitles  # make the GIF using start and stop timestamps with subtitles (doesn't seem to work) (mpv-gif.lua)
ctrl+c      script-binding copy-time                # copy current timestamp to clipboard in HH:MM:SS.MS format (copy-time.lua)
ctrl+S      script-binding toggle-seeker            # toggle keyboard input to seek to inputted timestamp (seek-to.lua)
ctrl+v      script-binding paste-timestamp          # automatically seek to pasted timestamp from clipboard (seek-to.lua)
alt+b       script-binding sponsorblock             # toggle sponsorblock on/off (sponsorblock-minimal.lua)
