"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
linemode       = "size"
show_hidden    = false
sort_by        = "natural"
sort_sensitive = true
# mouse_events = []
title_format = "yazi: {cwd}"

[preview]
wrap        = "yes"
max_width   = 1500
max_height  = 1500
image_delay = 0

[input]
cursor_blink = false

[opener]
edit = [
    { run = '${EDITOR:=vi} "$@"', desc = "$EDITOR", block = true },
    { run = 'code "$@"', orphan = true },
]
play = [
    { run = 'mpv --force-window "$@"', orphan = true },
    { run = 'iina --no-stdin "$@"' },
    { run = '''mediainfo "$1"; echo "Press enter to exit"; read''', block = true, desc = "Show media info" },
]
extract = [
    { run = 'ouch d -y %*', desc = "Extract here with ouch", for = "windows" },
    { run = 'ouch d -y "$@"', desc = "Extract here with ouch", for = "unix" },
    { run = 'ya pub extract --list "$@"', desc = "Extract here" },
    { run = '/Applications/MacZip.app/Contents/MacOS/MacZip "$1"', orphan = true, desc = "MacZip" },
]
subtitle = [
    { run = ''' echo sub-add "'$0'" | socat - /tmp/mpv.sock ''', desc = "Add sub to MPV" },
    { run = ''' opencc -c tw2sp -i "$1" -o "$1" ''', desc = "TW to SC" },
]
view = [
    { run = '''imv-dir "$@"''', orphan = true },
]

[[opener.set-wallpaper]]
run  = "hyprctl hyprpaper reload ,%s1"
for  = "linux"
desc = "Set as wallpaper"

[open]
prepend_rules = [
    { url = "*.{ass,srt,ssa,sty,sup,vtt}", use = [ "subtitle", "edit" ] },
    { mime = "image/*", use = [ "view", "set-wallpaper" ] },
]

[plugin]
prepend_fetchers = [
    { id = "git", url = "*", run = "git" },
    { id = "git", url = "*/", run = "git" },

    # { id = "mactag", name = "*", run = "mactag" },
    # { id = "mactag", name = "*/", run = "mactag" },
]
