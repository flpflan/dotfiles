# window border
window.active.border.color: #93cdf6
window.inactive.border.color: #b6c9d8

# ToggleKeybinds status indicator
window.active.indicator.toggled-keybind.color: #ffb4ab

# window titlebar background
window.active.title.bg.color: #93cdf6
window.inactive.title.bg.color: #b6c9d8

window.active.label.text.color: #00344c
window.inactive.label.text.color: #21323e
window.label.text.justify: center

# window button hover overlay
window.button.hover.bg.color: #262a2e

# window buttons
window.active.button.unpressed.image.color: #00344c
window.inactive.button.unpressed.image.color: #00344c

# menu
menu.border.color: #00344c
menu.items.bg.color: #93cdf6
menu.items.text.color: #00344c
menu.items.active.bg.color: #b6c9d8
menu.items.active.text.color: #21323e
menu.separator.color: #00344c
menu.title.bg.color: #93cdf6
menu.title.text.color: #00344c

# on screen display (window-cycle dialog)
osd.bg.color: #93cdf6
osd.border.color: #00344c
osd.label.text.color: #00344c
osd.window-switcher.preview.border.color: #8b9198
