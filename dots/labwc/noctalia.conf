# window border
window.active.border.color: #ffb4a7
window.inactive.border.color: #e7bdb5

# ToggleKeybinds status indicator
window.active.indicator.toggled-keybind.color: #ffb4ab

# window titlebar background
window.active.title.bg.color: #ffb4a7
window.inactive.title.bg.color: #e7bdb5

window.active.label.text.color: #561e15
window.inactive.label.text.color: #442925
window.label.text.justify: center

# window button hover overlay
window.button.hover.bg.color: #322826

# window buttons
window.active.button.unpressed.image.color: #561e15
window.inactive.button.unpressed.image.color: #561e15

# menu
menu.border.color: #561e15
menu.items.bg.color: #ffb4a7
menu.items.text.color: #561e15
menu.items.active.bg.color: #e7bdb5
menu.items.active.text.color: #442925
menu.separator.color: #561e15
menu.title.bg.color: #ffb4a7
menu.title.text.color: #561e15

# on screen display (window-cycle dialog)
osd.bg.color: #ffb4a7
osd.border.color: #561e15
osd.label.text.color: #561e15
osd.window-switcher.preview.border.color: #a08c89
